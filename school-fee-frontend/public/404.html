<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
        // GitHub Pages SPA fallback: redirect unknown paths to index.html.
        const basePath = window.location.pathname.split("/").slice(0, 2).join("/");
        const target = `${basePath}/?redirect=${encodeURIComponent(window.location.pathname + window.location.search + window.location.hash)}`;
        window.location.replace(target);
    </script>
</head>

<body></body>

</html>
